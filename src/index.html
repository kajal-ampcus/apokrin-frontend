      (function () {
        try {
          var saved = localStorage.getItem('apokrin-theme');
          var theme = saved === 'green' || saved === 'orange' || saved === 'blue' ? saved : 'blue';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'blue');
        }
      })();
